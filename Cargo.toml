[workspace]
members = [
  "examples/caveman",
  "examples/deepseek-harness",
  "examples/ponytails",
    "sdk/rust/tokensaver-plugin",
    "tools/tsp",
    "tools/tsp-certification-host",
    "tools/tsp-certification-confinement",
    "tools/tsp-certification-confinement-linux",
    "tools/tsp-certification-confinement-macos",
    "tools/tsp-certification-confinement-windows",
    "tools/tsp-certification-worker",
    "tools/tsp-runtime-host",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.86"

[workspace.dependencies]
base64 = "0.22.1"
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
fs2 = "0.4.3"
getrandom = "0.3.4"
libc = "0.2.186"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
windows-sys = "0.61.2"
