name: TokenSaver Plugin SDK release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version, without the v prefix
        required: true

concurrency:
  group: sdk-release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  SDK_VERSION: 0.1.3

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0
          components: clippy, rustfmt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: sdk/go/tokensaverplugin/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: sdk/typescript/tokensaver-plugin/package-lock.json
      - name: Verify release version and source tag
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          requested="$REQUESTED_VERSION"
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then requested="${GITHUB_REF_NAME#v}"; fi
          bash scripts/verify-release-source.sh "$requested"
      - name: Verify complete SDK
        run: bash scripts/verify.sh

  native-confinement-windows:
    name: Verify Windows confinement contract
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0
          components: clippy
      - name: Test Windows confinement adapter
        run: cargo test --locked -p tokensaver-certification-confinement-windows
      - name: Run native Windows confinement proof
        run: cargo test --locked -p tokensaver-certification-confinement-windows --test native_windows -- --ignored --nocapture
      - name: Run product runtime host through native Windows confinement
        run: cargo test --locked -p tokensaver-plugin-runtime-host --test native_runtime -- --ignored --nocapture
      - name: Lint Windows confinement and runtime host
        run: |
          cargo clippy --locked -p tokensaver-certification-confinement-windows --all-targets -- -D warnings
          cargo clippy --locked -p tokensaver-plugin-runtime-host --all-targets -- -D warnings

  native-confinement-linux:
    name: Verify Linux confinement on a real kernel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0
          components: clippy
          targets: x86_64-unknown-linux-musl
      - name: Install static Linux linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Test and lint Linux confinement adapter
        run: |
          set -euo pipefail
          cargo test --locked -p tokensaver-certification-confinement-linux --lib
          cargo clippy --locked -p tokensaver-certification-confinement-linux --all-targets -- -D warnings
      - name: Run native Linux confinement and runtime-host proof
        run: sudo env PROOF_RUST_TARGET=x86_64-unknown-linux-musl bash scripts/test-runtime-host-wsl.sh "$USER"

  native-confinement-macos:
    name: Verify macOS confinement on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0
          components: clippy
      - name: Test and lint macOS confinement adapter
        run: |
          set -euo pipefail
          cargo test --locked -p tokensaver-certification-confinement-macos --lib
          cargo clippy --locked -p tokensaver-certification-confinement-macos --all-targets -- -D warnings
          cargo clippy --locked -p tokensaver-plugin-runtime-host --all-targets -- -D warnings
      - name: Run native macOS confinement proof
        run: cargo test --locked -p tokensaver-certification-confinement-macos --test native_macos -- --ignored --nocapture
      - name: Run product runtime host through native macOS confinement
        env:
          TOKENSAVER_PLUGIN_TEST_LIMIT_LAUNCHER: ${{ github.workspace }}/target/debug/tsp-macos-confinement-launcher
        run: cargo test --locked -p tokensaver-plugin-runtime-host --test native_runtime -- --ignored --nocapture

  package-ponytails:
    name: Package Ponytails for ${{ matrix.platform }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs:
      - quality
      - native-confinement-windows
      - native-confinement-linux
      - native-confinement-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
            executable: ponytails.exe
            rust_target: x86_64-pc-windows-msvc
          - platform: windows-arm64
            runner: windows-11-arm
            executable: ponytails.exe
            rust_target: aarch64-pc-windows-msvc
          - platform: linux-x64
            runner: ubuntu-24.04
            executable: ponytails
            rust_target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            executable: ponytails
            rust_target: aarch64-unknown-linux-musl
          - platform: darwin-x64
            runner: macos-15-intel
            executable: ponytails
            rust_target: x86_64-apple-darwin
          - platform: darwin-arm64
            runner: macos-15
            executable: ponytails
            rust_target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0
          targets: ${{ matrix.rust_target }}
      - uses: actions/setup-python@v5
        with:
          # Windows arm64 has no hosted Python 3.10 toolcache entry. Packaging
          # uses only the standard-library verifier; quality still proves the
          # public SDK's documented Python 3.10 minimum separately.
          python-version: '3.13'
      - name: Install static Linux runtime host linker
        if: startsWith(matrix.platform, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Build native Ponytails executable
        run: cargo build --locked --release -p ponytails
      - name: Build trusted product runtime host
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          cargo build --locked --release --target "$RUST_TARGET" -p tokensaver-plugin-runtime-host --bin tokensaver-plugin-runtime-host
          if [[ "${{ matrix.platform }}" == darwin-* ]]; then
            cargo build --locked --release --target "$RUST_TARGET" -p tokensaver-certification-confinement-macos --bin tsp-macos-confinement-launcher
          fi
      - name: Package and record native conformance
        env:
          PLATFORM: ${{ matrix.platform }}
          RUST_TARGET: ${{ matrix.rust_target }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          set -euo pipefail
          mkdir -p "examples/ponytails/bin/$PLATFORM" dist
          cp "target/release/$EXECUTABLE" "examples/ponytails/bin/$PLATFORM/$EXECUTABLE"
          package="com.vic-e.tokensaver.ponytails-${{ env.SDK_VERSION }}-$PLATFORM.tsplug"
          cargo run --locked --release -p tsp-workbench -- package examples/ponytails --output "dist/$package" --json > "dist/$package.package-report.json"
      - name: Upload native package evidence
        uses: actions/upload-artifact@v4
        with:
          name: ponytails-${{ matrix.platform }}
          path: |
            dist/*.tsplug
            dist/*.tsplug.package-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Attest native plugin package provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Stage and upload trusted runtime host
        env:
          PLATFORM: ${{ matrix.platform }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          destination="runtime-host/$PLATFORM"
          mkdir -p "$destination"
          suffix=""
          if [[ "$PLATFORM" == windows-* ]]; then suffix=".exe"; fi
          host_file="tokensaver-plugin-runtime-host$suffix"
          cp "target/$RUST_TARGET/release/$host_file" "$destination/$host_file"
          host_digest="$(sha256sum "$destination/$host_file" | awk '{print $1}')"
          if [[ "$PLATFORM" == darwin-* ]]; then
            launcher_file="tokensaver-plugin-limit-launcher"
            cp "target/$RUST_TARGET/release/tsp-macos-confinement-launcher" "$destination/$launcher_file"
            launcher_digest="$(sha256sum "$destination/$launcher_file" | awk '{print $1}')"
            printf '{"schemaVersion":1,"platform":"%s","host":{"file":"%s","sha256":"sha256:%s"},"limitLauncher":{"file":"%s","sha256":"sha256:%s"}}\n' \
              "$PLATFORM" "$host_file" "$host_digest" "$launcher_file" "$launcher_digest" \
              > "$destination/runtime-host-assets.v1.json"
          else
            printf '{"schemaVersion":1,"platform":"%s","host":{"file":"%s","sha256":"sha256:%s"}}\n' \
              "$PLATFORM" "$host_file" "$host_digest" \
              > "$destination/runtime-host-assets.v1.json"
          fi
          python scripts/verify_runtime_host_assets.py \
            --directory "$destination" \
            --platform "$PLATFORM" \
            --write-checksums
          (
            cd "$destination"
            sha256sum --check --strict SHA256SUMS
          )
          python scripts/verify_runtime_host_assets.py --directory "$destination" --platform "$PLATFORM"
      - name: Upload trusted runtime host
        uses: actions/upload-artifact@v4
        with:
          name: tokensaver-runtime-host-${{ matrix.platform }}
          path: runtime-host/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14
      - name: Attest trusted runtime-host build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: runtime-host/${{ matrix.platform }}/*

  package-caveman:
    name: Package Caveman plugin for ${{ matrix.platform }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs:
      - quality
      - native-confinement-windows
      - native-confinement-linux
      - native-confinement-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
            executable: tokensaver-caveman-plugin.exe
          - platform: windows-arm64
            runner: windows-11-arm
            executable: tokensaver-caveman-plugin.exe
          - platform: linux-x64
            runner: ubuntu-24.04
            executable: tokensaver-caveman-plugin
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            executable: tokensaver-caveman-plugin
          - platform: darwin-x64
            runner: macos-15-intel
            executable: tokensaver-caveman-plugin
          - platform: darwin-arm64
            runner: macos-15
            executable: tokensaver-caveman-plugin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0
      - name: Build native Caveman plugin executable
        run: cargo build --locked --release -p tokensaver-caveman-plugin
      - name: Package and record native conformance
        env:
          PLATFORM: ${{ matrix.platform }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          set -euo pipefail
          mkdir -p "examples/caveman/bin/$PLATFORM" dist
          cp "target/release/$EXECUTABLE" "examples/caveman/bin/$PLATFORM/$EXECUTABLE"
          package="com.vic-e.tokensaver.caveman-${{ env.SDK_VERSION }}-$PLATFORM.tsplug"
          cargo run --locked --release -p tsp-workbench -- package examples/caveman --output "dist/$package" --json > "dist/$package.package-report.json"
      - name: Upload native package evidence
        uses: actions/upload-artifact@v4
        with:
          name: caveman-${{ matrix.platform }}
          path: |
            dist/*.tsplug
            dist/*.tsplug.package-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Attest native plugin package provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

  catalog-caveman:
    needs: package-caveman
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0
      - name: Download native package evidence
        uses: actions/download-artifact@v4
        with:
          pattern: caveman-*
          path: dist
          merge-multiple: true
      - name: Verify packages and assemble deterministic catalog
        run: |
          set -euo pipefail
          mkdir release
          cargo run --locked --release -p tsp-workbench -- catalog dist --output release/com.vic-e.tokensaver.caveman-${{ env.SDK_VERSION }}-catalog.json --json
      - name: Upload immutable release set
        uses: actions/upload-artifact@v4
        with:
          name: caveman-${{ env.SDK_VERSION }}-release
          path: |
            dist/*.tsplug
            dist/*.tsplug.package-report.json
            release/com.vic-e.tokensaver.caveman-${{ env.SDK_VERSION }}-catalog.json
          if-no-files-found: error
          retention-days: 30
      - name: Attest immutable plugin release-set provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/com.vic-e.tokensaver.caveman-${{ env.SDK_VERSION }}-catalog.json

  package-deepseek-harness:
    name: Package DeepSeek Harness plugin for ${{ matrix.platform }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs:
      - quality
      - native-confinement-windows
      - native-confinement-linux
      - native-confinement-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
            executable: tokensaver-deepseek-harness-plugin.exe
          - platform: windows-arm64
            runner: windows-11-arm
            executable: tokensaver-deepseek-harness-plugin.exe
          - platform: linux-x64
            runner: ubuntu-24.04
            executable: tokensaver-deepseek-harness-plugin
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            executable: tokensaver-deepseek-harness-plugin
          - platform: darwin-x64
            runner: macos-15-intel
            executable: tokensaver-deepseek-harness-plugin
          - platform: darwin-arm64
            runner: macos-15
            executable: tokensaver-deepseek-harness-plugin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0
      - name: Build native DeepSeek Harness plugin executable
        run: cargo build --locked --release -p tokensaver-deepseek-harness-plugin
      - name: Package and record native conformance
        env:
          PLATFORM: ${{ matrix.platform }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          set -euo pipefail
          mkdir -p "examples/deepseek-harness/bin/$PLATFORM" dist
          cp "target/release/$EXECUTABLE" "examples/deepseek-harness/bin/$PLATFORM/$EXECUTABLE"
          package="com.vic-e.tokensaver.deepseek-harness-${{ env.SDK_VERSION }}-$PLATFORM.tsplug"
          cargo run --locked --release -p tsp-workbench -- package examples/deepseek-harness --output "dist/$package" --json > "dist/$package.package-report.json"
      - name: Upload native package evidence
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-${{ matrix.platform }}
          path: |
            dist/*.tsplug
            dist/*.tsplug.package-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Attest native plugin package provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

  catalog-deepseek-harness:
    needs: package-deepseek-harness
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0
      - name: Download native package evidence
        uses: actions/download-artifact@v4
        with:
          pattern: deepseek-harness-*
          path: dist
          merge-multiple: true
      - name: Verify packages and assemble deterministic catalog
        run: |
          set -euo pipefail
          mkdir release
          cargo run --locked --release -p tsp-workbench -- catalog dist --output release/com.vic-e.tokensaver.deepseek-harness-${{ env.SDK_VERSION }}-catalog.json --json
      - name: Upload immutable release set
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-${{ env.SDK_VERSION }}-release
          path: |
            dist/*.tsplug
            dist/*.tsplug.package-report.json
            release/com.vic-e.tokensaver.deepseek-harness-${{ env.SDK_VERSION }}-catalog.json
          if-no-files-found: error
          retention-days: 30
      - name: Attest immutable plugin release-set provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/com.vic-e.tokensaver.deepseek-harness-${{ env.SDK_VERSION }}-catalog.json

  catalog-ponytails:
    needs: package-ponytails
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0
      - name: Download native package evidence
        uses: actions/download-artifact@v4
        with:
          pattern: ponytails-*
          path: dist
          merge-multiple: true
      - name: Verify packages and assemble deterministic catalog
        run: |
          set -euo pipefail
          mkdir release
          cargo run --locked --release -p tsp-workbench -- catalog dist --output release/com.vic-e.tokensaver.ponytails-${{ env.SDK_VERSION }}-catalog.json --json
      - name: Upload immutable release set
        uses: actions/upload-artifact@v4
        with:
          name: ponytails-${{ env.SDK_VERSION }}-release
          path: |
            dist/*.tsplug
            dist/*.tsplug.package-report.json
            release/com.vic-e.tokensaver.ponytails-${{ env.SDK_VERSION }}-catalog.json
          if-no-files-found: error
          retention-days: 30
      - name: Attest immutable plugin release-set provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/com.vic-e.tokensaver.ponytails-${{ env.SDK_VERSION }}-catalog.json

  runtime-host-release:
    name: Assemble trusted runtime-host release bundle
    needs: package-ponytails
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Download all native runtime-host artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tokensaver-runtime-host-*
          path: release/runtime-host-download
      - name: Verify and assemble exact six-platform bundle
        run: |
          set -euo pipefail
          download_root="release/runtime-host-download"
          output_root="release/runtime-host"
          expected=(
            windows-x64
            windows-arm64
            linux-x64
            linux-arm64
            darwin-x64
            darwin-arm64
          )
          [[ "$(find "$download_root" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 6 ]]
          mkdir -p "$output_root"
          for platform in "${expected[@]}"; do
            source="$download_root/tokensaver-runtime-host-$platform"
            destination="$output_root/$platform"
            [[ -d "$source" ]]
            mkdir "$destination"
            cp -a "$source/." "$destination/"
            (
              cd "$destination"
              sha256sum --check --strict SHA256SUMS
            )
            python scripts/verify_runtime_host_assets.py --directory "$destination" --platform "$platform"
          done
          (
            cd "$output_root"
            find . -mindepth 2 -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
      - name: Upload exact runtime-host release bundle
        uses: actions/upload-artifact@v4
        with:
          name: tokensaver-runtime-host-release
          path: release/runtime-host/
          if-no-files-found: error
          retention-days: 30
      - name: Attest runtime-host release bundle provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/runtime-host/**/*

  publish:
    name: Publish GitHub release
    needs:
      - quality
      - catalog-caveman
      - catalog-deepseek-harness
      - catalog-ponytails
      - runtime-host-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download Ponytails release set
        uses: actions/download-artifact@v4
        with:
          name: ponytails-${{ env.SDK_VERSION }}-release
          path: release-assets/plugins
      - name: Download DeepSeek Harness release set
        uses: actions/download-artifact@v4
        with:
          name: deepseek-harness-${{ env.SDK_VERSION }}-release
          path: release-assets/plugins
      - name: Download Caveman release set
        uses: actions/download-artifact@v4
        with:
          name: caveman-${{ env.SDK_VERSION }}-release
          path: release-assets/plugins
      - name: Download native runtime-host release set
        uses: actions/download-artifact@v4
        with:
          name: tokensaver-runtime-host-release
          path: release-assets/runtime-host
      - name: Verify and prepare release assets
        run: |
          set -euo pipefail
          python scripts/check-version.py "${{ env.SDK_VERSION }}"
          mkdir -p release-assets/final
          find release-assets/plugins -type f \( -name '*.tsplug' -o -name '*.json' \) -exec cp -- '{}' release-assets/final/ \;
          tar -C release-assets/runtime-host -czf "release-assets/final/tokensaver-runtime-host-${{ env.SDK_VERSION }}.tar.gz" .
          (
            cd release-assets/final
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v${{ env.SDK_VERSION }}"
          mapfile -d '' assets < <(find release-assets/final -maxdepth 1 -type f -print0 | LC_ALL=C sort -z)
          flags=()
          case "${{ env.SDK_VERSION }}" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published artifacts.' >&2
            exit 1
          else
            gh release create "$tag" "${assets[@]}" --verify-tag --repo "$GH_REPO" \
              --title "TokenSaver Plugin SDK ${{ env.SDK_VERSION }}" \
              --notes-file CHANGELOG.md "${flags[@]}"
          fi
